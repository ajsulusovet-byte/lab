:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f8f5;--card:#fff;--tx:#12261a;--mu:#5b6f62;--ac:#0b8043;--bd:#d5e3da;--ok:#d9f2e2;--no:#fbdcdc}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:680px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0}.mu{color:var(--mu);font-size:14px}

.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.big{font-size:44px;font-weight:800;color:var(--ac)}

.pic img,.pic svg{max-width:100%;max-height:260px;width:auto;height:auto;display:inline-block;border-radius:8px}

const $=document.getElementById("app");
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let S;
const pic=k=>k[0]=="i"?`<img src="${IM[k.slice(2)]}" alt="сурет">`:sv(k.slice(2));
function home(){
 $.innerHTML=`<h1>🧬 Биология · Қайталау: суретпен жұмыс</h1><p class="mu">Суретпен тест: суретті қарап, атын тап. ${Q.length} сұрақ. Жауап бергеннен кейін дұрыс жауап бірден көрсетіледі.</p><button class="p" onclick="start()" style="width:100%;font-size:18px">Бастау</button>`;
}
function start(){S={qs:sh(Q).map(r=>({k:r[0],q:r[1],o:sh(r.slice(2).map((x,i)=>({x,c:i==0})))})),i:0,a:[]};show()}
function show(){
 const q=S.qs[S.i],n=S.qs.length;
 $.innerHTML=`<div class="row mu"><span>Суретпен тест</span><span>${S.i+1} / ${n}</span></div><div class="bar"><i style="width:${S.i/n*100}%"></i></div>
 <div class="pic">${pic(q.k)}</div><div class="card"><b>${S.i+1}. ${q.q}</b></div>
 ${q.o.map((o,k)=>`<button class="o" data-k="${k}" onclick="pick(${k})">${"ABCD"[k]}. ${o.x}</button>`).join("")}
 <div id="fb" style="margin-top:10px;font-weight:600"></div><div class="row" style="margin-top:14px"><button class="g" onclick="home()">Шығу</button><button class="p" id="nx" disabled onclick="next()">${S.i==n-1?"Аяқтау":"Келесі"}</button></div>`;
 S.sel=null;
}
function pick(k){if(S.sel!==null)return;S.sel=k;const q=S.qs[S.i];document.querySelectorAll(".o").forEach(b=>{const i=+b.dataset.k;if(q.o[i].c)b.classList.add("r");else if(i==k)b.classList.add("w")});document.getElementById("nx").disabled=false;document.getElementById("fb").textContent=q.o[k].c?"✅ Дұрыс!":"❌ Қате. Дұрыс жауап: "+q.o.find(o=>o.c).x}
function next(){S.a.push(S.sel);if(++S.i<S.qs.length)show();else done()}
function done(){
 const n=S.qs.length,ok=S.qs.filter((q,i)=>q.o[S.a[i]].c).length,pc=Math.round(ok/n*100);
 const bad=S.qs.map((q,i)=>({q,i})).filter(({q,i})=>!q.o[S.a[i]].c);
 $.innerHTML=`<div class="card" style="text-align:center"><div class="big">${ok} / ${n}</div><div>${pc}% · ${pc>=85?"Өте жақсы! 🎉":pc>=65?"Жақсы, жалғастыр":"Қайталау керек"}</div></div>
 <div class="row"><button class="p" onclick="start()">Қайта тапсыру</button><button class="g" onclick="home()">Мәзір</button></div>
 <h3>${bad.length?"Қателер талдауы ("+bad.length+")":"Барлығы дұрыс!"}</h3>
 ${bad.map(({q,i})=>`<div class="rv"><div class="pic">${pic(q.k)}</div><b>${i+1}. ${q.q}</b><br><span style="color:#c44">Сенің жауабың: ${q.o[S.a[i]].x}</span><br><span style="color:var(--ac)">Дұрысы: ${q.o.find(o=>o.c).x}</span></div>`).join("")}`;
 window.scrollTo(0,0);
}
home();
</script></body></html>
