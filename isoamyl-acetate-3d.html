label{display:block;color:var(--mu);margin:4px 0 2px}
input[type=range]{width:100%;accent-color:var(--ac)}
#msg{margin:6px 0;padding:8px 10px;border-radius:8px;background:var(--bg);border-left:5px solid var(--mu)}
#msg.w{border-color:var(--bad)}#msg.g{border-color:var(--ok)}
.eq{color:var(--ac);font-size:.9rem;margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:6px}
th,td{border-bottom:1px solid var(--ln);padding:4px 3px;text-align:left}
th{color:var(--mu);font-weight:600}
#res{display:none;margin-top:8px;padding:10px;background:var(--bg);border-radius:8px;border-left:5px solid var(--ok)}
.hide{display:none}
</style>
</head>

</div>

var sc=new THREE.Scene();sc.background=new THREE.Color(0x0e1f23);

add(new THREE.Mesh(new THREE.BoxGeometry(14,.4,5),M(0x3a4a4f)),.2,-.2,0);
[-5.5,1.6].forEach(function(x){add(new THREE.Mesh(new THREE.BoxGeometry(1,.15,1),steel),x,.07,-.9);cyl(.07,.07,5.6,steel,x,2.8,-.9)});

seg(V3(-5.5,3.4,-.9),V3(-3.9,3.4,-.2),.06,steel,gA);seg(V3(1.6,2.3,-.9),V3(1.2,2.3,-.2),.06,steel,gA);

cyl(.06,.06,2.6,M(0xffffff,{transparent:true,opacity:.7}),-2.4,1.9,.6,gA);

var cA=V3(-2.0,3.1,0),cB=V3(2.9,2.3,0);
seg(cA,cB,.12,glass,gA);
var jA=seg(V3(-1.6,3.03,0),V3(2.5,2.37,0),.4,new THREE.MeshStandardMaterial({color:0xcfeeff,transparent:true,opacity:.07,depthWrite:false}),gA);
var vA=seg(cA,cB,.09,new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:0,depthWrite:false}),gA);
seg(V3(2.9,2.3,0),V3(3.8,2.1,0),.14,glass,gA);seg(V3(3.8,2.1,0),V3(3.9,1.9,0),.07,glass,gA);

var jB=cyl(.4,.4,1.5,new THREE.MeshStandardMaterial({color:0xcfeeff,transparent:true,opacity:.07,depthWrite:false}),-1.5,5.25,0,gB);
var vB=cyl(.09,.09,1.6,new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:0,depthWrite:false}),-1.5,5.2,0,gB);

/* ---------- UI ---------- */
var $=function(i){return document.getElementById(i)};
function msg(t,c){$("msg").textContent=t;$("msg").className=c||""}
function render(){
var st=STEPS[E],ri=RUNI[E],s=S.s;
$("eA").className=E=="A"?"on":"";$("eB").className=E=="B"?"on":"";$("eq").textContent=EQ[E];

/* ---------- simulation ---------- */
function step(dt){
