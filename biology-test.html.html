];
const PARTS=[{n:"1-бөлім · Эволюциялық даму",q:T1},{n:"2-бөлім · Микробиология және биотехнология",q:T2},{n:"3-бөлім · Биосфера",q:T3}];
const ALL=[].concat(T1,T2,T3);
const $=document.getElementById("app");
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let S;
function home(){
 $.innerHTML=`<h1>🧬 Биология · АЙЛЫҚ ТЕСТКЕ СӘТТІЛІК 50/50 ТІЛЕЙМІН АЙСС АПАЙДАН🥰💓</h1><p class="mu">Эволюциялық даму, микробиология және биотехнология, биосфера. Жауап нұсқалары әр рет араласады.</p>
 <button class="m" onclick="start(-1)"><b>Толық тест</b> · ${ALL.length} сұрақ<br><span class="mu">Үш бөлім бірге, аралас реттілікпен</span></button>
 ${PARTS.map((p,i)=>`<button class="m" onclick="start(${i})"><b>${p.n}</b> · ${p.q.length} сұрақ</button>`).join("")}`;
}
function start(i){
 const src=i<0?sh(ALL):PARTS[i].q;
 S={t:i<0?"Толық тест":PARTS[i].n,qs:src.map(r=>{const o=sh(r.slice(1).map((x,k)=>({x,c:k==0})));return{q:r[0],o}}),i:0,a:[]};
 show();
}
function show(){
 const q=S.qs[S.i],n=S.qs.length;
 $.innerHTML=`<div class="row mu"><span>${S.t}</span><span>${S.i+1} / ${n}</span></div><div class="bar"><i style="width:${S.i/n*100}%"></i></div>
 <div class="card"><b>${S.i+1}. ${q.q}</b></div>
 ${q.o.map((o,k)=>`<button class="o" data-k="${k}" onclick="pick(${k})">${"ABCD"[k]}. ${o.x}</button>`).join("")}
 <div id="fb" style="margin-top:10px;font-weight:600"></div><div class="row" style="margin-top:14px"><button class="g" onclick="home()">Шығу</button><button class="p" id="nx" disabled onclick="next()">${S.i==n-1?"Аяқтау":"Келесі"}</button></div>`;
 S.sel=null;
}
function pick(k){if(S.sel!==null)return;S.sel=k;const q=S.qs[S.i];document.querySelectorAll(".o").forEach(b=>{const i=+b.dataset.k;if(q.o[i].c)b.classList.add("r");else if(i==k)b.classList.add("w")});document.getElementById("nx").disabled=false;document.getElementById("fb").textContent=q.o[k].c?"✅ Дұрыс!":"❌ Қате. Дұрыс жауап: "+q.o.find(o=>o.c).x}
function next(){S.a.push(S.sel);if(++S.i<S.qs.length)show();else done()}
function done(){
 const n=S.qs.length,ok=S.qs.filter((q,i)=>q.o[S.a[i]].c).length,pc=Math.round(ok/n*100);
 const bad=S.qs.map((q,i)=>({q,i})).filter(({q,i})=>!q.o[S.a[i]].c);
 $.innerHTML=`<div class="card" style="text-align:center"><div class="mu">${S.t}</div><div class="big">${ok} / ${n}</div><div>${pc}% · ${pc>=85?"Өте жақсы! 🎉":pc>=65?"Жақсы, жалғастыр":pc>=40?"Қанағаттанарлық, қайталау керек":"Тақырыпты қайта оқы"}</div></div>
 <div class="row"><button class="p" onclick="start(${S.t=="Толық тест"?-1:PARTS.findIndex(p=>p.n==S.t)})">Қайта тапсыру</button><button class="g" onclick="home()">Мәзір</button></div>
 <h3>${bad.length?"Қателер талдауы ("+bad.length+")":"Барлығы дұрыс!"}</h3>
 ${bad.map(({q,i})=>`<div class="rv"><b>${i+1}. ${q.q}</b><br><span style="color:#c44">Сенің жауабың: ${q.o[S.a[i]].x}</span><br><span style="color:var(--ac)">Дұрысы: ${q.o.find(o=>o.c).x}</span></div>`).join("")}`;
 window.scrollTo(0,0);
}
home();
</script></body></html>
