<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Биологиялық үдерістердің 3D моделі</title>
<style>
:root{--bg:#eef3f8;--panel:#ffffff;--ink:#14263a;--mute:#5a6b7d;--line:#cfd9e4;--acc:#0f766e;--accink:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a26;--panel:#16283a;--ink:#e6eef6;--mute:#93a6b8;--line:#2b4157;--acc:#2dd4bf;--accink:#06231f}}
:root[data-theme="dark"]{--bg:#0d1a26;--panel:#16283a;--ink:#e6eef6;--mute:#93a6b8;--line:#2b4157;--acc:#2dd4bf;--accink:#06231f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;gap:8px;padding:10px 12px;align-items:center}
header h1{font-size:15px;margin:0 auto 0 0;font-weight:700}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 12px;border-radius:20px;font-size:14px;cursor:pointer}
.tab[aria-pressed=true]{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
#view{flex:1;min-height:0;position:relative;touch-action:none}
#view canvas{display:block;width:100%;height:100%}
#hint{position:absolute;left:12px;top:6px;font-size:12px;color:var(--mute)}
#panel{background:var(--panel);border-top:1px solid var(--line);padding:12px;max-height:42%;overflow:auto}
#panel h2{margin:0 0 4px;font-size:17px}
#panel p{margin:0 0 8px;font-size:14px;line-height:1.5;color:var(--ink)}
#chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 10px;border-radius:16px;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
#dnaCtl{display:none;gap:10px;align-items:center}
#dnaCtl input{flex:1;accent-color:var(--acc)}
.leg{font-size:12px;color:var(--mute);margin-top:6px}
</style>
</head>
<body>
<header>
  <h1>Биология: 3D модельдер</h1>
  <button class="tab" id="tCell" aria-pressed="true">Жасуша</button>
  <button class="tab" id="tDna" aria-pressed="false">ДНҚ репликациясы</button>
</header>
<div id="view"><div id="hint">Айналдыру: саусақпен сүйреңіз · Жақындату: қысыңыз · Бөлікті басып таңдаңыз</div></div>
<div id="panel">
  <h2 id="ttl"></h2>
  <p id="txt"></p>
  <div id="chips"></div>
  <div id="dnaCtl"><button class="tab" id="play">▶ Бастау</button><input type="range" id="sl" min="0" max="1000" value="0" aria-label="Репликация барысы"></div>
  <div class="leg" id="leg"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const wrap=document.getElementById('view');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
wrap.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,1,.1,100);
scene.add(new THREE.AmbientLight(0xffffff,.75));
const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(5,8,6);scene.add(dl);
const root=new THREE.Group();scene.add(root);
let rotX=.25,rotY=0,dist=11,mode='cell',idle=true;
function resize(){const w=wrap.clientWidth,h=wrap.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.5,metalness:.05},o));

/* ---------- ЖАСУША ---------- */
const cellG=new THREE.Group();root.add(cellG);
const INFO={
 membrane:['Жасуша мембранасы','Липидтердің қос қабаты мен белоктардан тұрады. Жасушаны қоршап, заттардың кіруі мен шығуын реттейді (жартылай өткізгіштік).','#7fb2ff'],
 nucleus:['Ядро','Ядрода ДНҚ сақталады. Ол тұқым қуалайтын ақпаратты сақтап, жасуша әрекетін басқарады. Ішіндегі ядрошықта рибосомалар құрылады.','#8e6fd8'],
 mito:['Митохондрия','Жасушаның «энергетикалық станциясы». Тыныс алу кезінде органикалық заттардан АТФ молекуласын түзеді. Ішкі қабаты қатпарланған (кристалар).','#e2574c'],
 er:['Эндоплазмалық тор (ЭПТ)','Мембраналы түтікшелер мен қапшықтар жүйесі. Кедір-бұдырлы ЭПТ-де рибосомалар бар, белок синтезделеді; тегіс ЭПТ майлар мен көмірсуларды түзеді.','#f2c14e'],
 golgi:['Гольджи аппараты','Жалпақ қапшықтар үйіндісі. Белоктар мен липидтерді өзгертіп, буып, жасушадан тыс шығаруға немесе басқа бөлімдерге жібереді. Лизосомалар осында түзіледі.','#3fbf8f'],
 ribo:['Рибосомалар','Өте ұсақ бөлшектер. Белок синтезі (трансляция) осында жүреді. Еркін немесе ЭПТ бетінде орналасады.','#4b5563'],
 lyso:['Лизосомалар','Ішінде қорыту ферменттері бар көпіршіктер. Ескірген органоидтарды, бактерияларды және қоректік заттарды ыдыратады.','#ff9f43']
};
const parts={};
function reg(key,obj){obj.userData.key=key;cellG.add(obj);(parts[key]=parts[key]||[]).push(obj);return obj}
const sph=(r,c,o)=>new THREE.Mesh(new THREE.SphereGeometry(r,24,18),M(c,o));
reg('membrane',sph(3.3,0x7fb2ff,{transparent:true,opacity:.14,depthWrite:false,side:THREE.DoubleSide}));
const nuc=new THREE.Group();
const nm=sph(1,0x8e6fd8,{transparent:true,opacity:.8});nuc.add(nm);const nl=sph(.35,0x4a2f95);nl.position.set(.2,.1,.3);nuc.add(nl);
reg('nucleus',nuc);
[[1.7,.9,1.3,.4],[-1.7,-1.2,1.4,2],[.5,-2,-1.4,1]].forEach(p=>{
 const g=new THREE.Group();const a=sph(1,0xe2574c,{transparent:true,opacity:.85});a.scale.set(.6,.3,.3);
 const b=sph(.8,0xffb3a7);b.scale.set(.5,.2,.2);g.add(a,b);g.position.set(p[0],p[1],p[2]);g.rotation.set(p[3],p[3]*1.7,p[3]*.6);reg('mito',g)});
const er=new THREE.Group();
[[0,0],[1.1,.5],[.5,1.4]].forEach((r,i)=>{const t=new THREE.Mesh(new THREE.TorusGeometry(1.45+i*.12,.09,10,48),M(0xf2c14e));t.rotation.set(r[0],r[1],0);er.add(t)});
reg('er',er);
const gol=new THREE.Group();
for(let i=0;i<4;i++){const t=new THREE.Mesh(new THREE.TorusGeometry(.6-i*.04,.07,10,32),M(0x3fbf8f));t.rotation.x=Math.PI/2;t.position.y=i*.19-.28;gol.add(t)}
gol.position.set(1.5,-1.3,.7);gol.rotation.z=.4;reg('golgi',gol);
for(let i=0;i<70;i++){const u=Math.random()*2-1,a=Math.random()*6.283,s=Math.sqrt(1-u*u),R=i<45?1.55:1.2+Math.random()*1.6;
 const m=sph(.07,0x4b5563);m.position.set(R*s*Math.cos(a),R*u,R*s*Math.sin(a));reg('ribo',m)}
[[-1.9,1.4,-1],[2,-.5,-1.7],[-.5,2.1,1.4],[1,1.7,-1.8]].forEach(p=>{const m=sph(.22,0xff9f43);m.position.set(...p);reg('lyso',m)});

function selectCell(k){
 Object.keys(parts).forEach(key=>parts[key].forEach(o=>o.traverse(m=>{if(m.material&&m.material.emissive)m.material.emissive.setHex(key===k&&k!=='membrane'?0x555555:0)})));
 document.getElementById('ttl').textContent=INFO[k][0];
 document.getElementById('txt').textContent=INFO[k][1];
 document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.k===k));
}
const chips=document.getElementById('chips');
Object.keys(INFO).forEach(k=>{const b=document.createElement('button');b.className='chip';b.dataset.k=k;b.textContent=INFO[k][0].split(' (')[0];b.onclick=()=>selectCell(k);chips.appendChild(b)});

/* ---------- ДНҚ РЕПЛИКАЦИЯСЫ ---------- */
const dnaG=new THREE.Group();root.add(dnaG);dnaG.visible=false;
const N=40,STEP=.22,R0=.9;
const sg=new THREE.SphereGeometry(.13,12,10),cg=new THREE.CylinderGeometry(1,1,1,8);
const mOA=M(0x2f7de1),mOB=M(0x1fb5a0),mNew=M(0xff7a45);
const rodM=[M(0xffd166),M(0xc77dff)];
const P=[];
for(let i=0;i<N;i++){
 const o={oA:new THREE.Mesh(sg,mOA),oB:new THREE.Mesh(sg,mOB),nA:new THREE.Mesh(sg,mNew),nB:new THREE.Mesh(sg,mNew)};
 const t=(i*7+3)%5<2?0:1;
 o.r1=new THREE.Mesh(cg,rodM[t]);o.r2=new THREE.Mesh(cg,rodM[t]);o.r3=new THREE.Mesh(cg,rodM[t]);
 Object.values(o).forEach(m=>dnaG.add(m));P.push(o)}
const helicase=new THREE.Mesh(new THREE.TorusGeometry(1.25,.22,12,32),M(0x9aa5b1));helicase.rotation.x=Math.PI/2;dnaG.add(helicase);
const pol1=new THREE.Mesh(new THREE.SphereGeometry(.38,16,12),M(0x8b5cf6)),pol2=pol1.clone();dnaG.add(pol1,pol2);
const up=new THREE.Vector3(0,1,0),v1=new THREE.Vector3(),v2=new THREE.Vector3();
function rod(m,a,b,vis){
 if(vis<.03){m.visible=false;return}
 m.visible=true;m.position.copy(a).add(b).multiplyScalar(.5);
 v1.copy(b).sub(a);const L=v1.length();m.quaternion.setFromUnitVectors(up,v1.normalize());m.scale.set(.045*vis,L,.045*vis)}
const lerp=(a,b,t)=>a+(b-a)*t;
function setS(s){
 for(let i=0;i<N;i++){
  const o=P[i],y=(N/2-i)*STEP,a=i*.55,c=Math.cos(a),n=Math.sin(a);
  let k=Math.min(1,Math.max(0,(s*(N+6)-i)/6));k=k*k*(3-2*k);
  const hA=[R0*c,y,R0*n],hB=[-R0*c,y,-R0*n];
  const fOA=[-2.3+.6*c,y,.6*n],fNA=[-2.3-.6*c,y,-.6*n],fOB=[2.3-.6*c,y,-.6*n],fNB=[2.3+.6*c,y,.6*n];
  const ps=(m,h,f)=>m.position.set(lerp(h[0],f[0],k),lerp(h[1],f[1],k),lerp(h[2],f[2],k));
  ps(o.oA,hA,fOA);ps(o.oB,hB,fOB);ps(o.nA,hA,fNA);ps(o.nB,hB,fNB);
  o.nA.visible=o.nB.visible=k>.05;o.nA.scale.setScalar(k);o.nB.scale.setScalar(k);
  rod(o.r1,o.oA.position,o.oB.position,1-k);
  rod(o.r2,o.oA.position,o.nA.position,k);
  rod(o.r3,o.oB.position,o.nB.position,k);
 }
 const fy=(N/2-(s*(N+6)-3))*STEP;
 const on=s>.01&&s<.99;
 helicase.visible=pol1.visible=pol2.visible=on;
 helicase.position.y=fy+.45;pol1.position.set(-2.3,fy-.9,0);pol2.position.set(2.3,fy-.9,0);
 const T=document.getElementById('txt');
 document.getElementById('ttl').textContent=s<.01?'1. Бастапқы ДНҚ молекуласы':on?'2. Репликация жүріп жатыр':'3. Нәтиже: екі жаңа ДНҚ';
 T.textContent=s<.01?'Қос тізбекті спираль: екі тізбек азотты негіздер арқылы сутектік байланыспен ұсталған. Аденин (А) тиминмен (Т), гуанин (Г) цитозинмен (Ц) жұптасады. Жүгірткіні жылжытыңыз.':
 on?'Хеликаза ферменті (сұр сақина) сутектік байланыстарды үзіп, тізбектерді ажыратады. ДНҚ-полимераза (күлгін) әр ескі тізбекке комплементарлық принцип бойынша жаңа нуклеотидтер (қызғылт-сары) жалғайды.':
 'Екі ДНҚ молекуласының әрқайсысында бір тізбек ескі (көк немесе жасыл), бір тізбек жаңа (қызғылт-сары). Мұны жартылай консервативті репликация деп атайды.';
}
document.getElementById('leg').innerHTML='';
let playing=false,S=0;
const sl=document.getElementById('sl'),pb=document.getElementById('play');
sl.oninput=()=>{S=sl.value/1000;setS(S)};
pb.onclick=()=>{playing=!playing;if(playing&&S>=1){S=0}pb.textContent=playing?'❚❚ Тоқтату':'▶ Бастау'};

/* ---------- РЕЖИМ ---------- */
function setMode(m){
 mode=m;cellG.visible=m==='cell';dnaG.visible=m==='dna';
 document.getElementById('tCell').setAttribute('aria-pressed',m==='cell');
 document.getElementById('tDna').setAttribute('aria-pressed',m==='dna');
 chips.style.display=m==='cell'?'flex':'none';
 document.getElementById('dnaCtl').style.display=m==='dna'?'flex':'none';
 document.getElementById('leg').textContent=m==='dna'?'Негіз жұптары: сары — А–Т, күлгін — Г–Ц. Көк және жасыл — ескі тізбектер, қызғылт-сары — жаңа.':'Жануар жасушасы (шартты түрде көрсетілген, масштабы сақталмаған).';
 rotX=.25;rotY=0;dist=m==='cell'?11:15;
 if(m==='cell')selectCell('nucleus');else setS(S);
}
document.getElementById('tCell').onclick=()=>setMode('cell');
document.getElementById('tDna').onclick=()=>setMode('dna');

/* ---------- БАСҚАРУ ---------- */
const ptr=new Map();let pd=0,moved=0,sx=0,sy=0;
const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);moved=0;sx=e.clientX;sy=e.clientY;idle=false;if(ptr.size===2){const a=[...ptr.values()];pd=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])}});
cv.addEventListener('pointermove',e=>{
 if(!ptr.has(e.pointerId))return;const p=ptr.get(e.pointerId);
 if(ptr.size===1){rotY+=(e.clientX-p[0])*.008;rotX+=(e.clientY-p[1])*.008;rotX=Math.max(-1.5,Math.min(1.5,rotX));moved+=Math.abs(e.clientX-p[0])+Math.abs(e.clientY-p[1])}
 ptr.set(e.pointerId,[e.clientX,e.clientY]);
 if(ptr.size===2){const a=[...ptr.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);dist=Math.min(24,Math.max(5,dist*pd/d));pd=d;moved+=10}
});
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
cv.addEventListener('pointerup',e=>{
 ptr.delete(e.pointerId);
 if(mode==='cell'&&moved<6&&Math.abs(e.clientX-sx)<6){
  const r=cv.getBoundingClientRect();mv.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(mv,camera);root.updateMatrixWorld(true);
  const hits=ray.intersectObjects(cellG.children,true);let key=null;
  for(const h of hits){let o=h.object;while(o&&!o.userData.key)o=o.parent;if(o&&o.userData.key!=='membrane'){key=o.userData.key;break}}
  if(!key&&hits.length)key='membrane';
  if(key)selectCell(key);
 }
});
cv.addEventListener('wheel',e=>{e.preventDefault();dist=Math.min(24,Math.max(5,dist+e.deltaY*.01))},{passive:false});

function loop(){
 requestAnimationFrame(loop);
 if(playing){S+=.0025;if(S>=1){S=1;playing=false;pb.textContent='▶ Қайта бастау'}sl.value=S*1000;setS(S)}
 if(idle&&mode==='cell')rotY+=.003;
 root.rotation.set(rotX,rotY,0);camera.position.set(0,0,dist);
 renderer.render(scene,camera);
}
resize();setMode('cell');loop();
new ResizeObserver(resize).observe(wrap);
</script>
</body>
</html>
