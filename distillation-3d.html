<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D виртуалды зертхана: жай айдау</title>
<style>
:root{--bg:#0e1f23;--pn:#14292e;--ln:#2a474d;--tx:#e7f2f0;--mu:#93b0ad;--ac:#ffb020;--wt:#4cc9f0;--ok:#69db7c;--bad:#ff8787}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#cv{flex:1;min-height:0;position:relative;touch-action:none}
#cv canvas{display:block;width:100%;height:100%}
#hud{position:absolute;left:10px;top:10px;background:rgba(14,31,35,.82);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;pointer-events:none}
#hud b{font-size:1.6rem;color:var(--ac)}
#hud small{display:block;color:var(--mu)}
#tip{position:absolute;right:10px;top:10px;color:var(--mu);font-size:.8rem;text-align:right;pointer-events:none;max-width:40%}
#pn{background:var(--pn);border-top:2px solid var(--ln);padding:10px 12px;max-height:44vh;overflow-y:auto}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
button{flex:1;min-width:30%;padding:10px 6px;border:2px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
button.on{border-color:var(--ok);color:var(--ok)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
label{display:block;color:var(--mu);margin-bottom:2px}
input[type=range]{width:100%;accent-color:var(--ac)}
#msg{min-height:1.4em;margin:6px 0;padding:8px 10px;border-radius:8px;background:var(--bg);border-left:5px solid var(--mu)}
#msg.w{border-color:var(--bad)}#msg.g{border-color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:6px}
th,td{border-bottom:1px solid var(--ln);padding:5px 3px;text-align:left}
th{color:var(--mu);font-weight:600}
td.c{text-align:right}
#res{margin-top:8px;display:none}
</style>
</head>
<body>
<div id="cv">
<div id="hud"><b id="T">22 °C</b><small id="fr">Күту</small><small id="vv">Дистиллят: 0 мл</small></div>
<div id="tip">Айналдыру: саусақпен сүйреңіз. Жақындату: екі саусақпен.</div>
</div>
<div id="pn">
<div class="row">
<button id="b1">1. Колбаны толтыр (70 мл)</button>
<button id="b2" disabled>2. Қайнағыш сал</button>
<button id="b3">3. Суды аш</button>
</div>
<label for="pw">4. Қыздыру қуаты: <span id="pwv">0</span> %</label>
<input id="pw" type="range" min="0" max="100" value="0" disabled>
<div class="row" style="margin-top:8px">
<button id="sp">Жылдамдық: ×1</button>
<button id="rs">Қайта бастау</button>
</div>
<div id="msg">Бірінші қадам: Вюрц колбасын 70 мл мұнаймен толтырыңыз.</div>
<table><thead><tr><th>Фракция</th><th>°C</th><th class="c">мл</th><th class="c">%</th></tr></thead><tbody id="tb"></tbody></table>
<div id="res"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
var NAMES=["Петролей эфирі","Лигроин","«Жеңіл» бензин","«Орташа» бензин","Керосин"];
var BP=[40,70,90,120,150,280],CV=[0,7,17,29,43,58],TOT=70,DIST=58;
var COL=[0xfff3b0,0xffe066,0xffc233,0xe8901a,0xa8570f];
var S;function reset(){S={fill:false,chips:false,water:false,pow:0,Td:22,V:0,done:false,spd:1}}reset();
function tNeed(v){for(var i=0;i<5;i++){if(v<=CV[i+1]){return BP[i]+(BP[i+1]-BP[i])*(v-CV[i])/(CV[i+1]-CV[i])}}return 280}
function frIdx(v){for(var i=0;i<5;i++)if(v<=CV[i+1])return i;return 4}
function fVol(i){return Math.max(0,Math.min(S.V,CV[i+1])-CV[i])}

/* ---- scene ---- */
var box=document.getElementById("cv");
var R=new THREE.WebGLRenderer({antialias:true});R.localClippingEnabled=true;R.setPixelRatio(Math.min(devicePixelRatio,2));
box.appendChild(R.domElement);
var sc=new THREE.Scene();sc.background=new THREE.Color(0x0e1f23);
var cam=new THREE.PerspectiveCamera(45,1,.1,100);
sc.add(new THREE.HemisphereLight(0xdff6ff,0x223038,.9));
var dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(4,9,6);sc.add(dl);
function M(c,o){return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.5,metalness:.1},o||{}))}
var glass=M(0xcfeeff,{transparent:true,opacity:.22,roughness:.05,side:THREE.DoubleSide,depthWrite:false});
var steel=M(0x8a979a,{metalness:.7,roughness:.35});
function add(m,x,y,z){m.position.set(x,y,z);sc.add(m);return m}
function seg(a,b,r,mat){var d=new THREE.Vector3().subVectors(b,a);var m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),24),mat);m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());sc.add(m);return m}
function V3(x,y,z){return new THREE.Vector3(x,y,z)}
/* bench */
add(new THREE.Mesh(new THREE.BoxGeometry(13,.4,5),M(0x3a4a4f)),0,-.2,0);
/* stands */
[-5.5,1.6].forEach(function(x){add(new THREE.Mesh(new THREE.BoxGeometry(1,.15,1),steel),x,.07,-.9);add(new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,4.6,12),steel),x,2.3,-.9)});
seg(V3(-5.5,2.9,-.9),V3(-4.2,2.9,-.2),.06,steel);
seg(V3(1.6,2.1,-.9),V3(1.1,2.1,-.2),.06,steel);
/* heater */
var heater=add(new THREE.Mesh(new THREE.CylinderGeometry(1.15,1.3,.5,32),M(0x222222,{emissive:0x000000})),-4,.25,0);
/* flask: Würtz */
var FY=1.65,FR=1;
add(new THREE.Mesh(new THREE.SphereGeometry(FR,32,24),glass),-4,FY,0);
var neck=add(new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,1.5,20),glass),-4,FY+1.5,0);
seg(V3(-4,3.0,0),V3(-2.3,3.0,0),.13,glass);
var plane=new THREE.Plane(new THREE.Vector3(0,-1,0),0);
var liq=add(new THREE.Mesh(new THREE.SphereGeometry(.96,32,24),new THREE.MeshStandardMaterial({color:0x6b3a0a,transparent:true,opacity:.85,clippingPlanes:[plane],side:THREE.DoubleSide})),-4,FY,0);
/* thermometer */
var th=add(new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,2.2,12),M(0xffffff,{transparent:true,opacity:.7})),-4,3.2,0);
var merc=add(new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,1,8),M(0xd62828)),-4,2.2,0);
var bulb=add(new THREE.Mesh(new THREE.SphereGeometry(.09,12,12),M(0xd62828)),-4,2.1,0);
/* condenser (Liebig) */
var cA=V3(-2.3,3.0,0),cB=V3(2.9,2.2,0);
seg(cA,cB,.12,glass);
var jacket=seg(cA.clone().lerp(cB,.08),cB.clone().lerp(cA,.08),.4,new THREE.MeshStandardMaterial({color:0x4cc9f0,transparent:true,opacity:.07,depthWrite:false}));
var vap=seg(cA,cB,.09,new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:0,depthWrite:false}));
seg(V3(2.9,2.2,0),V3(3.8,2.0,0),.14,glass);seg(V3(3.8,2.0,0),V3(3.9,1.8,0),.07,glass);
/* receiver */
var RX=3.9;
add(new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,1.9,24),glass),RX,.95,0);
var layers=COL.map(function(c){var m=add(new THREE.Mesh(new THREE.CylinderGeometry(.31,.31,1,24),M(c,{transparent:true,opacity:.9})),RX,.1,0);m.visible=false;return m});
var drop=add(new THREE.Mesh(new THREE.SphereGeometry(.06,10,10),M(0xffc233)),RX,1.8,0);drop.visible=false;
/* bubbles */
var bub=[];for(var i=0;i<14;i++){var b=add(new THREE.Mesh(new THREE.SphereGeometry(.05,8,8),M(0xffffff,{transparent:true,opacity:.6})),-4,FY,0);b.visible=false;b.userData={p:Math.random(),a:Math.random()*6.28,r:Math.random()*.5};bub.push(b)}
/* chips */
var chips=[];for(var i=0;i<4;i++){var c=add(new THREE.Mesh(new THREE.DodecahedronGeometry(.1),M(0xe9e2d0)),-4+(i-1.5)*.18,FY-.85,(i%2-.5)*.3);c.visible=false;chips.push(c)}

/* ---- camera orbit ---- */
var az=.35,el=.32,dist=13,tgt=V3(-.3,1.8,0),pts={},pd=0;
function setCam(){cam.position.set(tgt.x+dist*Math.cos(el)*Math.sin(az),tgt.y+dist*Math.sin(el),tgt.z+dist*Math.cos(el)*Math.cos(az));cam.lookAt(tgt)}
function size(){var w=box.clientWidth,h=box.clientHeight;R.setSize(w,h);cam.aspect=w/h;if(w/h<1)dist=Math.max(dist,17);cam.updateProjectionMatrix();setCam()}
addEventListener("resize",size);
var cvEl=R.domElement;
cvEl.addEventListener("pointerdown",function(e){cvEl.setPointerCapture(e.pointerId);pts[e.pointerId]={x:e.clientX,y:e.clientY};pd=0});
cvEl.addEventListener("pointermove",function(e){var p=pts[e.pointerId];if(!p)return;var ids=Object.keys(pts);
if(ids.length===1){az-=(e.clientX-p.x)*.007;el=Math.max(.05,Math.min(1.3,el+(e.clientY-p.y)*.006))}
else{var o=pts[ids.filter(function(k){return k!=e.pointerId})[0]];var d0=Math.hypot(p.x-o.x,p.y-o.y),d1=Math.hypot(e.clientX-o.x,e.clientY-o.y);dist=Math.max(6,Math.min(26,dist*d0/Math.max(d1,1)))}
p.x=e.clientX;p.y=e.clientY;setCam()});
function up(e){delete pts[e.pointerId]}
cvEl.addEventListener("pointerup",up);cvEl.addEventListener("pointercancel",up);
cvEl.addEventListener("wheel",function(e){e.preventDefault();dist=Math.max(6,Math.min(26,dist*(1+e.deltaY*.001)));setCam()},{passive:false});

/* ---- UI ---- */
var $=function(i){return document.getElementById(i)};
var tb=$("tb");NAMES.forEach(function(n,i){var r=document.createElement("tr");r.innerHTML="<td>"+n+"</td><td>"+(i?BP[i]:"< "+BP[1])+(i?"–"+BP[i+1]:"")+"</td><td class='c' id='v"+i+"'>0</td><td class='c' id='p"+i+"'>0</td>";tb.appendChild(r)});
tb.firstChild.children[1].textContent="до 70";
function msg(t,c){var m=$("msg");m.textContent=t;m.className=c||""}
function sync(){
$("b1").className=S.fill?"on":"";$("b1").disabled=S.fill;
$("b2").className=S.chips?"on":"";$("b2").disabled=!S.fill||S.chips;
$("b3").className=S.water?"on":"";$("b3").textContent=S.water?"3. Су ашық ✓":"3. Суды аш";
$("pw").disabled=!S.fill||S.done;
liq.visible=S.fill;chips.forEach(function(c){c.visible=S.chips})}
$("b1").onclick=function(){S.fill=true;sync();msg("Келесі қадам: колбаға «қайнағыш» (жылтыратпаған фарфор кесектері) салыңыз.")};
$("b2").onclick=function(){S.chips=true;sync();msg("Енді тоңазытқышқа суды ашыңыз: су төменгі тесікпен кіріп, жоғарғысымен шығады.")};
$("b3").onclick=function(){S.water=!S.water;sync();msg(S.water?"Су ашылды. Қыздыруды баяу бастаңыз.":"Су жабылды.")};
$("pw").oninput=function(){S.pow=+this.value;$("pwv").textContent=S.pow};
$("sp").onclick=function(){S.spd=S.spd===1?3:S.spd===3?6:1;this.textContent="Жылдамдық: ×"+S.spd};
$("rs").onclick=function(){var s=S.spd;reset();S.spd=s;$("pw").value=0;$("pwv").textContent=0;$("res").style.display="none";sync();msg("Бірінші қадам: Вюрц колбасын 70 мл мұнаймен толтырыңыз.")};

/* ---- simulation ---- */
var last=performance.now(),acc=0,tmr=0;
function step(dt){
if(!S.fill||S.done)return;
var tn=tNeed(S.V),boil=S.Td>=tn&&S.V<DIST;S.boil=boil;S.dist=false;
S.Td+=(S.pow*.03-.008*(S.Td-22))*dt;
if(boil&&S.water){var dv=Math.min((S.Td-tn)*.35*dt,DIST-S.V);S.V+=dv;S.Td-=dv*3;S.dist=dv>0}
else if(boil&&!S.water&&S.pow>0){S.Td=Math.min(S.Td,tn+6)}
if(S.V>=DIST-.01)finish()}
function finish(){S.done=true;S.pow=0;S.dist=false;S.boil=false;$("pw").value=0;$("pwv").textContent=0;sync();
var lite=(fVol(0)+fVol(1)+fVol(2))/TOT*100;
var kind=lite>=40?"«жеңіл»":lite>=25?"«орташа»":"«ауыр»";
var r=$("res");r.style.display="block";
r.innerHTML="<b>Қорытынды.</b> 120 °C дейін өткен фракциялар "+lite.toFixed(0)+" % құрайды. Осы модель бойынша қолданылған мұнай "+kind+" (≥40 % жеңіл, 25–40 % орташа, одан аз ауыр). Колбада қалдық: "+(TOT-DIST)+" мл. Нәтижелерді кестеге жазыңыз.";
msg("Айдау аяқталды. Дистиллят көлемі: "+S.V.toFixed(1)+" мл.","g")}
function warn(){
if(S.done)return;
if(S.pow>0&&!S.chips)return msg("Қайнағыш жоқ: сұйық біркелкі қайнамайды, лақтырылуы мүмкін. Қыздыруды тоқтатып, қайнағыш салыңыз.","w");
if(S.pow>0&&!S.water&&S.Td>=40)return msg("Тоңазытқышқа су ашылмаған! Булар конденсацияланбайды. Суды ашыңыз.","w");
if(S.pow>80)return msg("Тым тез қыздыру: булар аса қызып кетеді. Қуатты азайтып, баяу бірқалыпты қайнауды ұстаңыз.","w");
if(S.pow>0&&S.fill&&S.chips&&S.water){var i=frIdx(S.V);return msg(S.dist?"Айдау жүріп жатыр: "+NAMES[i]+" ("+S.Td.toFixed(0)+" °C).":"Колба қыздырылып жатыр: "+S.Td.toFixed(0)+" °C.","g")}}
function ui(){
$("T").textContent=S.Td.toFixed(0)+" °C";
$("vv").textContent="Дистиллят: "+S.V.toFixed(1)+" мл";
$("fr").textContent=S.done?"Аяқталды":S.dist?NAMES[frIdx(S.V)]:S.fill?"Қыздыру":"Күту";
for(var i=0;i<5;i++){var v=fVol(i);$("v"+i).textContent=v.toFixed(1);$("p"+i).textContent=(v/TOT*100).toFixed(1)}}

/* ---- render loop ---- */
function frame(now){
var dt=Math.min((now-last)/1000,.1)*S.spd;last=now;
step(dt);
if(now-tmr>200){tmr=now;ui();warn()}
/* heater glow */
heater.material.emissive.setRGB(S.pow/100*.9,S.pow/100*.25,0);
/* liquid level */
var f=Math.max(0,(TOT-S.V)/TOT),lv=FY-FR+2*FR*.6*f+.05;plane.constant=lv;
liq.material.color.setHex(S.V>CV[3]?0x4a2406:0x6b3a0a);
/* thermometer */
var h=.3+Math.min(S.Td,300)/300*1.6;merc.scale.y=h;merc.position.y=2.1+h/2;
/* bubbles & shake */
var shake=S.boil&&!S.chips?(Math.random()-.5)*.05:0;
liq.position.x=-4+shake;
bub.forEach(function(b){var u=b.userData;if(S.boil||(S.fill&&S.Td>90&&S.pow>0)){b.visible=true;u.p=(u.p+dt*.5*(S.chips?1:2.5))%1;b.position.set(-4+Math.cos(u.a)*u.r*.8,FY-.7+u.p*(lv-FY+.7),Math.sin(u.a)*u.r*.8)}else b.visible=false});
/* vapor, jacket, drop */
vap.material.opacity+=((S.dist?.55:S.boil&&S.water?.2:0)-vap.material.opacity)*.1;
jacket.material.opacity=S.water?.22:.07;jacket.material.color.setHex(S.water?0x4cc9f0:0xcfeeff);
var base=.1,sc2=1.8/DIST;
for(var i=0;i<5;i++){var v=fVol(i),m=layers[i];if(v>.01){m.visible=true;var hh=v*sc2;m.scale.y=hh;m.position.y=base+hh/2;base+=hh}else m.visible=false}
drop.visible=S.dist;if(S.dist){var q=(now/350)%1;drop.position.y=1.75-q*(1.75-base-.05)}
R.render(sc,cam);requestAnimationFrame(frame)}
size();sync();ui();requestAnimationFrame(frame);
</script>
</body>
</html>
